<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
<title>ことばチャレンジャー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--font:"M PLUS Rounded 1c","Yu Gothic",Meiryo,sans-serif;--text:#334155;--muted:#64748b;--blue:#3b82f6;--green:#22c55e;--yellow:#fbbf24;--red:#ef4444;--border:#cbd5e1;--board:#174f3b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--board);font-family:var(--font);color:var(--text)}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.screen{display:none;width:100%;height:100%}.screen.active{display:flex}
.sn-title{margin:0;font-size:36px;font-weight:900;color:#fff;text-align:center;line-height:1}
.sn-btn{min-height:54px;padding:2px 8px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--text);font-size:28px;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 2px 5px #0002}
.sn-btn:hover{transform:translateY(-2px)}.sn-btn:disabled{opacity:.42;cursor:default;transform:none}
.sn-success{background:#22c55e;border-color:#16a34a;color:#fff}.sn-warning{background:#fbbf24;border-color:#f59e0b;color:#713f12}.sn-danger{background:#ef4444;border-color:#dc2626;color:#fff}
.sn-home-btn{min-height:40px;padding:2px 10px;border:2px solid #93c5fd;border-radius:999px;background:#fff;color:#2563eb;font-size:24px;font-weight:900;line-height:1;cursor:pointer}
#topScreen{align-items:center;justify-content:center;flex-direction:column;gap:22px}
#topScreen>.sn-title{font-size:70px}
.topBtns{display:grid;grid-template-columns:repeat(4,minmax(215px,290px));gap:16px}
.bigBtn{min-height:125px;padding:1%;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1}
.bigBtnMain,.bigBtnSub{font-size:38px;font-weight:900;letter-spacing:-.06em;line-height:1}
.hira{background:#fee2e2;border-color:#ef4444}.shiri{background:#dbeafe;border-color:#3b82f6}.kata{background:#dcfce7;border-color:#22c55e}.battle{background:#fef9c3;border-color:#eab308}
.helpBtn{position:fixed;right:18px;top:14px;font-size:20px}
#topScreen>.katakanaMenuTitle{font-size:54px}
#setupScreen,#battleSetupScreen{align-items:center;justify-content:center;flex-direction:column;gap:9px}
.optionBlock{display:flex;flex-direction:column;align-items:center}.optionLabel{font-size:22px;line-height:1;font-weight:900;color:#fff;text-align:center;margin:2px 0 4px}.optionRow{display:flex;gap:10px;justify-content:center}
.optionBtn{min-width:205px;min-height:64px;padding:1px 3px;font-size:32px;line-height:1;background:#fff;font-weight:900}
.optionBtn.selected{background:#dbeafe;border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.3)}
#startBtn,#battleStartBtn{min-width:260px!important;min-height:58px;padding:1px 8px!important;font-size:38px!important;line-height:1}
#gameScreen{flex-direction:column;padding:8px 14px 10px;gap:7px}.header{height:64px;display:grid;grid-template-columns:1fr 2fr 1.25fr;align-items:center}.headerLeft{display:flex;gap:7px}.gameName{text-align:center;font-size:30px;font-weight:900;color:#fff}
.rightStatus{display:flex;justify-content:center;align-items:center;gap:14px}.score{font-size:70px;font-weight:900;color:#fde047;white-space:nowrap;line-height:1;text-align:center}
.topGameArea{height:145px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.75fr);gap:10px}
.wordArea,.completedArea{background:#fff;border:2px solid #e2e8f0;border-radius:20px;box-shadow:0 4px 12px #0002}
.wordArea{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}.prompt{font-size:22px;font-weight:800;color:var(--muted);min-height:28px}.currentWord{font-size:64px;line-height:1.05;font-weight:900;letter-spacing:.08em;min-height:70px}.message{font-size:21px;font-weight:900;min-height:26px;color:#dc2626}
.completedArea{display:flex;flex-direction:column;overflow:hidden}.completedTitle{padding:3px 6px;text-align:center;background:#eff6ff;border-bottom:2px solid #e2e8f0;font-size:20px;font-weight:900}.completedWords{flex:1;overflow-y:auto;padding:5px;display:flex;align-content:flex-start;flex-wrap:wrap;gap:4px}.wordChip{padding:2px 7px;border:2px solid #bbf7d0;border-radius:999px;background:#f0fdf4;font-size:19px;font-weight:900}
.controls{height:54px;display:flex;justify-content:center;gap:8px}.controls .sn-btn{min-height:50px;padding:2px 8px;font-size:30px}
.timerClock{position:relative;width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid #fde047;box-shadow:0 2px 7px #0004;flex:none}.timerClock.hidden{display:none}.timerClock.warning{border-color:#ef4444;background:#fff1f2}
.timerClock::before{content:"";position:absolute;left:50%;top:5px;width:4px;height:23px;background:#ef4444;border-radius:3px;transform-origin:50% 24px;transform:translateX(-50%) rotate(var(--timer-angle,0deg))}
.timerClock::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:#334155;border-radius:50%;transform:translate(-50%,-50%)}.timerNumber{position:absolute;left:50%;top:50%;transform:translate(-50%,4px);font-size:14px;font-weight:900;color:#334155;line-height:1}
.timerMark{position:absolute;background:#64748b}.timerMark.t12{width:2px;height:6px;left:50%;top:1px;transform:translateX(-50%)}.timerMark.t3{width:6px;height:2px;right:1px;top:50%;transform:translateY(-50%)}.timerMark.t6{width:2px;height:6px;left:50%;bottom:1px;transform:translateX(-50%)}.timerMark.t9{width:6px;height:2px;left:1px;top:50%;transform:translateY(-50%)}
.keyboardWrap{flex:1;min-height:0;padding-bottom:4px;display:flex;align-items:stretch;justify-content:center;gap:9px}.kanaTable{flex:1;min-width:0;display:flex;flex-direction:row-reverse;justify-content:center;gap:6.25px}.kanaCol{flex:1;min-width:0;max-width:100px;display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:4px}
.kanaBtn{min-width:0;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-size:clamp(25px,min(5vw,5.5vh),64px);line-height:1;font-weight:900;cursor:pointer;user-select:none;box-shadow:0 2px 4px #0001}
.kanaBtn:hover{background:#eff6ff;border-color:#93c5fd}.kanaBtn:disabled{background:#e2e8f0;color:#a3aab5;cursor:default}.blank{visibility:hidden}
.extraPanel{width:109px;height:50%;align-self:center;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:5px}.extraBtn{min-width:0;min-height:0;padding:1%;border:2px solid #fbbf24;border-radius:10px;background:#fffbeb;color:var(--text);font-size:27px;line-height:1;font-weight:900;cursor:pointer}
#battleScreen{flex-direction:column;padding:8px 14px 10px;gap:7px}.battleHeader{height:64px;display:grid;grid-template-columns:1fr 2fr 1.25fr;align-items:center}.battleTitle{text-align:center;font-size:32px;font-weight:900;color:#fff}.battleHeaderRight{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.battlePlayers{height:185px;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px}.playerPanel{background:#fff;border-radius:18px;padding:6px;border:4px solid transparent;display:flex;flex-direction:column;min-height:0}.playerPanel.activeTurn{border-color:#fde047;box-shadow:0 0 0 4px #fde04755}
.playerName{text-align:center;font-size:25px;font-weight:900}.playerScore{text-align:center;font-size:36px;font-weight:900;color:#f59e0b}.playerWords{flex:1;overflow-y:auto;display:flex;align-content:flex-start;flex-wrap:wrap;gap:4px;padding:3px}
.battleCenter{background:#fff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}.turnLabel{font-size:25px;font-weight:900;color:#2563eb}.battleRuleLabel{font-size:18px;font-weight:900;color:#64748b;min-height:22px}.battleCurrent{font-size:55px;font-weight:900;letter-spacing:.08em;min-height:66px}.battleMessage{font-size:19px;font-weight:900;color:#dc2626;min-height:24px}
.battleControls{height:52px;display:flex;justify-content:center;gap:8px}.battleControls .sn-btn{min-height:48px;padding:2px 8px;font-size:29px}
#helpScreen{flex-direction:column;padding:14px 20px;gap:10px}.helpHeader{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center}.helpTabs{display:flex;justify-content:center;gap:10px}.helpTab.selected{background:#3b82f6;color:#fff;border-color:#2563eb}.helpContent{flex:1;min-height:0;overflow-y:auto;background:#fff;border-radius:20px;padding:18px 24px}.helpSection{margin-bottom:22px}.helpSection h2{margin:0 0 7px;color:#2563eb;font-size:25px}.helpSection p{font-size:19px;line-height:1.7;font-weight:700}
.successFlash{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;pointer-events:none}.successFlash.show{display:flex}.successFlashInner{padding:22px 42px;border:8px solid #fde047;border-radius:32px;background:#fffffff8;color:#16a34a;font-size:84px;font-weight:900;box-shadow:0 14px 40px #0006;animation:successPop .2s ease-out}
@keyframes successPop{0%{transform:scale(.45) rotate(-4deg)}70%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1)}}
.finishOverlay{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;background:#0008}.finishOverlay.show{display:flex}.finishBox{min-width:460px;max-width:90vw;padding:24px;background:#fff;border:7px solid #fde047;border-radius:30px;text-align:center}.finishScore{font-size:54px;font-weight:900;color:#f59e0b}.finishMessage{margin-top:8px;font-size:30px;font-weight:900}.finishButtons{margin-top:18px;display:flex;justify-content:center;gap:10px}
@media(max-width:1000px){#topScreen>.sn-title{font-size:56px}.topBtns{grid-template-columns:repeat(2,minmax(220px,290px))}.kanaBtn{font-size:clamp(24px,min(4.5vw,5.5vh),58px)}}
#onlineScreen{flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}.onlinePanel{background:white;border-radius:20px;padding:22px;max-width:720px;width:95%;text-align:center}.onlineCode{font-size:58px;font-weight:900;letter-spacing:.15em}.onlineRow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.onlineInfo{font-size:22px;font-weight:800}.helpPoster{display:block;width:100%;height:auto;max-width:1400px;margin:auto}.helpContent{overscroll-behavior:contain}.onlineNote{font-size:18px;color:#92400e;font-weight:800}.onlineDisabled{opacity:.5}
</style>
</head>
<body>
<div id="topScreen" class="screen active">
 <button class="sn-btn helpBtn" onclick="openHelp()">？ つかいかた</button>
 <h1 class="sn-title">ことばチャレンジャー</h1>
 <div class="topBtns">
  <button class="sn-btn bigBtn hira" onclick="chooseGame('word','hira')"><div class="bigBtnMain">😊 50音</div><div class="bigBtnSub">チャレンジャー</div></button>
  <button class="sn-btn bigBtn shiri" onclick="chooseGame('shiritori','hira')"><div class="bigBtnMain">😊 しりとり</div><div class="bigBtnSub">チャレンジャー</div></button>
  <button class="sn-btn bigBtn kata" onclick="showKatakanaMenu()"><div class="bigBtnMain">😊 カタカナ</div><div class="bigBtnSub">チャレンジャー</div></button>
  <button class="sn-btn bigBtn battle" onclick="openBattleSetup()"><div class="bigBtnMain">😀 対戦 😊</div><div class="bigBtnSub">チャレンジャー</div></button>
 </div>
</div>

<div id="setupScreen" class="screen">
 <h1 id="setupTitle" class="sn-title"></h1>
 <div id="levelArea" class="optionBlock"><div class="optionLabel">レベル</div><div class="optionRow">
  <button id="beginnerBtn" class="sn-btn optionBtn" onclick="selectLevel('beginner')">初級<br>あ・か・さ行</button>
  <button id="normalBtn" class="sn-btn optionBtn" onclick="selectLevel('normal')">ぜんぶ<br>50音</button>
 </div></div>
 <div id="useModeArea" class="optionBlock"><div class="optionLabel">もじ</div><div class="optionRow">
  <button id="remainBtn" class="sn-btn optionBtn" onclick="selectUseMode('remain')">もじが<br>のこる</button>
  <button id="vanishBtn" class="sn-btn optionBtn" onclick="selectUseMode('vanish')">もじが<br>きえる</button>
 </div></div>
 <div class="optionBlock"><div class="optionLabel">じかん</div><div class="optionRow">
  <button id="freeTimeBtn" class="sn-btn optionBtn" onclick="selectTimeMode('free')">じっくり</button>
  <button id="minuteTimeBtn" class="sn-btn optionBtn" onclick="selectTimeMode('minute')">⏱ 1分</button>
 </div></div>
 <button id="startBtn" class="sn-btn sn-success" onclick="startGame()" disabled>スタート！</button>
 <button class="sn-home-btn" onclick="goTop()">← もどる</button>
</div>

<div id="battleSetupScreen" class="screen">
 <h1 class="sn-title">対戦チャレンジャー</h1>
 <div class="optionBlock"><div class="optionLabel">たいせんあいて</div><div class="optionRow">
  <button id="cpuBtn" class="sn-btn optionBtn" onclick="selectBattleOpponent('cpu')">💻 コンピューター</button>
  <button id="humanBtn" class="sn-btn optionBtn" onclick="selectBattleOpponent('human')">👥 ふたり</button><button class="sn-btn optionBtn" onclick="openOnline()">🌐 オンライン</button>
 </div></div>
 <div class="optionBlock"><div class="optionLabel">もじ</div><div class="optionRow">
  <button id="battleHiraBtn" class="sn-btn optionBtn" onclick="selectBattleScript('hira')">ひらがな</button>
  <button id="battleKataBtn" class="sn-btn optionBtn" onclick="selectBattleScript('kata')">カタカナ</button>
 </div></div>
 <div class="optionBlock"><div class="optionLabel">ルール</div><div class="optionRow">
  <button id="battleWordBtn" class="sn-btn optionBtn" onclick="selectBattleGame('word')">ことば</button>
  <button id="battleShiriBtn" class="sn-btn optionBtn" onclick="selectBattleGame('shiritori')">しりとり</button>
 </div></div>
 <div class="optionBlock"><div class="optionLabel">もじのつかいかた</div><div class="optionRow">
  <button id="battleRemainBtn" class="sn-btn optionBtn" onclick="selectBattleUseMode('remain')">もじが のこる</button>
  <button id="battleVanishBtn" class="sn-btn optionBtn" onclick="selectBattleUseMode('vanish')">もじが きえる</button>
 </div></div>
 <div class="optionBlock"><div class="optionLabel">じかん</div><div class="optionRow">
  <button id="battleFreeBtn" class="sn-btn optionBtn" onclick="selectBattleTimeMode('free')">じっくり</button>
  <button id="battleMinuteBtn" class="sn-btn optionBtn" onclick="selectBattleTimeMode('minute')">⏱ 1分</button>
 </div></div>
 <button id="battleStartBtn" class="sn-btn sn-success" onclick="startBattle()" disabled>たいせんスタート！</button>
 <button class="sn-home-btn" onclick="goTop()">← もどる</button>
</div>

<div id="onlineScreen" class="screen"><h1 class="sn-title">🌐 オンライン対戦</h1><div class="onlinePanel"><div class="onlineRow" style="margin-bottom:10px"><select id="onlineScript" style="font-size:23px"><option value="hira">ひらがな</option><option value="kata">カタカナ</option></select><select id="onlineGame" style="font-size:23px"><option value="shiritori">しりとり</option><option value="word">ことば</option></select><select id="onlineUseMode" style="font-size:23px"><option value="remain">もじがのこる</option><option value="vanish">もじがきえる</option></select></div><div class="onlineRow"><button class="sn-btn sn-success" onclick="createOnlineRoom()">へやをつくる</button><button class="sn-btn" onclick="joinOnlineRoom()">へやにはいる</button></div><div id="onlineCode" class="onlineCode">------</div><div class="onlineRow"><input id="onlineInput" maxlength="6" inputmode="numeric" placeholder="6けたのコード" style="font-size:30px;width:230px;text-align:center;border:2px solid #94a3b8;border-radius:10px"><button class="sn-btn" onclick="copyOnlineUrl()">🔗 URLをコピー</button></div><p id="onlineStatus" class="onlineInfo">2人で同じへやに入って対戦しよう！</p><p class="onlineNote">参加コードは知っている友だちだけに伝えてね</p></div><button class="sn-home-btn" onclick="leaveOnlineRoom();goTop()">← トップ</button></div>
<div id="gameScreen" class="screen">
 <div class="header">
  <div class="headerLeft"><button class="sn-home-btn" onclick="goTop()">トップ</button><button class="sn-btn" onclick="restart()">やりなおす</button></div>
  <div id="gameName" class="gameName"></div>
  <div class="rightStatus"><div id="gameTimer" class="timerClock hidden"><span class="timerMark t12"></span><span class="timerMark t3"></span><span class="timerMark t6"></span><span class="timerMark t9"></span><span id="gameTimerNumber" class="timerNumber">60</span></div><div id="score" class="score">0てん</div></div>
 </div>
 <div class="topGameArea">
  <div class="wordArea"><div id="prompt" class="prompt"></div><div id="currentWord" class="currentWord"></div><div id="message" class="message"></div></div>
  <div class="completedArea"><div class="completedTitle">できた ことば</div><div id="completedWords" class="completedWords"></div></div>
 </div>
 <div class="controls"><button class="sn-btn" onclick="undoChar()">↩ 1もどす</button><button class="sn-btn sn-danger" onclick="clearWord()">ぜんぶけす</button><button class="sn-btn sn-success" onclick="submitWord()">できた！</button><button class="sn-btn sn-warning" onclick="giveUp()">あきらめる</button></div>
 <div class="keyboardWrap"><div id="extraPanel" class="extraPanel"></div><div id="kanaTable" class="kanaTable"></div></div>
</div>

<div id="battleScreen" class="screen">
 <div class="battleHeader"><div><button class="sn-home-btn" onclick="goTop()">トップ</button></div><div class="battleTitle">⚔ 対戦チャレンジャー</div><div class="battleHeaderRight"><span id="onlineBattleState" style="color:white;font-weight:900;font-size:19px"></span><div id="battleTimer" class="timerClock hidden"><span class="timerMark t12"></span><span class="timerMark t3"></span><span class="timerMark t6"></span><span class="timerMark t9"></span><span id="battleTimerNumber" class="timerNumber">60</span></div><button class="sn-btn sn-warning" onclick="finishBattle()">おわる</button></div></div>
 <div class="battlePlayers">
  <div id="player1Panel" class="playerPanel activeTurn"><div id="player1Name" class="playerName">プレイヤー1</div><div id="player1Score" class="playerScore">0てん</div><div id="player1Words" class="playerWords"></div></div>
  <div class="battleCenter"><div id="battleTurnLabel" class="turnLabel"></div><div id="battleRuleLabel" class="battleRuleLabel"></div><div id="battleCurrent" class="battleCurrent"></div><div id="battleMessage" class="battleMessage"></div></div>
  <div id="player2Panel" class="playerPanel"><div id="player2Name" class="playerName">プレイヤー2</div><div id="player2Score" class="playerScore">0てん</div><div id="player2Words" class="playerWords"></div></div>
 </div>
 <div class="battleControls"><button class="sn-btn" onclick="battleUndo()">↩ 1もどす</button><button class="sn-btn sn-danger" onclick="battleClear()">ぜんぶけす</button><button class="sn-btn sn-success" onclick="battleSubmit()">できた！</button></div>
 <div class="keyboardWrap"><div id="battleExtraPanel" class="extraPanel"></div><div id="battleKanaTable" class="kanaTable"></div></div>
</div>

<div id="helpScreen" class="screen">
 <div class="helpHeader"><div><button class="sn-home-btn" onclick="goTop()">← トップ</button></div><h1 class="sn-title">つかいかた</h1><div></div></div>
 <div class="helpTabs"><button id="studentHelpBtn" class="sn-btn helpTab selected" onclick="showHelp('student')">児童向け</button><button id="teacherHelpBtn" class="sn-btn helpTab" onclick="showHelp('teacher')">教員向け</button></div>
 <div id="helpContent" class="helpContent"></div>
</div>

<div id="successFlash" class="successFlash"><div id="successFlashInner" class="successFlashInner"></div></div>
<div id="finishOverlay" class="finishOverlay"><div class="finishBox"><div id="finishScore" class="finishScore"></div><div id="finishMessage" class="finishMessage"></div><div class="finishButtons"><button class="sn-btn sn-success" onclick="closeFinish()">もういちど</button><button class="sn-home-btn" onclick="goTopFromFinish()">トップにもどる</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
let WORD_SET=new Set();
const EXTRA_WORDS=new Set(["さた","ゆめみ","まんとひひ","ごりら"]);
function kataToHira_(text){return [...String(text||"")].map(ch=>{const c=ch.charCodeAt(0);return c>=0x30A1&&c<=0x30F6?String.fromCharCode(c-0x60):ch}).join("")}
function normalizeDictionaryWord_(word){return kataToHira_(String(word||"").trim())}
function installDictionary_(words){WORD_SET=new Set();if(Array.isArray(words))words.forEach(word=>{const w=normalizeDictionaryWord_(word);if(w)WORD_SET.add(w)});EXTRA_WORDS.forEach(word=>WORD_SET.add(word))}
function isValidLocalWord_(word){return WORD_SET.has(normalizeDictionaryWord_(word))}

let gameType='word',scriptType='hira',useMode='',levelMode='',timeMode='';
let score=0,current=[],currentSources=[],permanentlyUsed=new Set(),completedWords=[],requiredStart='';
let dictionaryReady=false,dictionaryLoading=false,dictionaryCallbacks=[],gameActive=false;
let battleOpponent='',battleScript='',battleGameType='',battleUseMode='',battleTimeMode='';
let battleTurn=1,battleCurrent=[],battleCurrentSources=[],battleScores=[0,0],battleWords=[[],[]],battleRequiredStart='';
let battleUsedSources=new Set(),cpuWordList=[],battleActive=false;
let timerInterval=null,timerDeadline=0,timerContext='';
let onlineDb=null,onlineUid='',onlineRoom='',onlineUnsub=null,onlineSnapshot=null,onlineBusy=false,onlineJoining=false,onlineFinishing=false;

const hiraCols=[['あ','い','う','え','お',''],['か','き','く','け','こ',''],['さ','し','す','せ','そ',''],['た','ち','つ','て','と',''],['な','に','ぬ','ね','の',''],['は','ひ','ふ','へ','ほ',''],['ま','み','む','め','も',''],['や','','ゆ','','よ',''],['ら','り','る','れ','ろ',''],['わ','','','','ん','']];
const hiraBeginnerCols=[['あ','い','う','え','お',''],['か','き','く','け','こ',''],['さ','し','す','せ','そ','']];

async function loadDictionary(callback){
 if(callback){if(dictionaryReady){callback();return}dictionaryCallbacks.push(callback)}
 if(dictionaryReady||dictionaryLoading)return;
 dictionaryLoading=true;
 try{
  const res=await fetch('./ことばチャレンジャー辞書.json',{cache:'no-store'});
  if(!res.ok)throw new Error('dictionary '+res.status);
  const words=await res.json();installDictionary_(words);dictionaryReady=true;cpuWordList=[...WORD_SET].filter(w=>w.length>=2&&w.length<=5);
  const list=dictionaryCallbacks.slice();dictionaryCallbacks=[];list.forEach(fn=>fn());
 }catch(e){console.error(e);dictionaryCallbacks=[];alert('辞書ファイル「ことばチャレンジャー辞書.json」を index.html と同じ場所に置いてください。')}
 finally{dictionaryLoading=false}
}

function startCountdown(context){stopCountdown();timerContext=context;timerDeadline=Date.now()+60000;const clock=context==='battle'?document.getElementById('battleTimer'):document.getElementById('gameTimer');clock.classList.remove('hidden');clock.classList.remove('warning');updateCountdown();timerInterval=setInterval(updateCountdown,100)}
function updateCountdown(){if(!timerContext)return;const remaining=Math.max(0,timerDeadline-Date.now()),seconds=Math.ceil(remaining/1000),elapsed=Math.min(60000,60000-remaining),angle=(elapsed/60000)*360;const clock=timerContext==='battle'?document.getElementById('battleTimer'):document.getElementById('gameTimer'),number=timerContext==='battle'?document.getElementById('battleTimerNumber'):document.getElementById('gameTimerNumber');clock.style.setProperty('--timer-angle',angle+'deg');number.textContent=seconds;clock.classList.toggle('warning',seconds<=10);if(remaining<=0){const c=timerContext;stopCountdown();c==='battle'?timedBattleFinish():timedGameFinish()}}

 let title=scriptType==='hira'?'ひらがな':'カタカナ';if(gameType==='shiritori')title+=' しりとり';else if(levelMode==='beginner')title+=' 初級チャレンジ';else title+=' ことばチャレンジ';if(timeMode==='minute')title+=' ⏱1分';

function buildKanaKeyboard(cols,extras,tableId,extraId,charFn,markFn,noExtra){
 const table=document.getElementById(tableId),extra=document.getElementById(extraId);table.innerHTML='';extra.innerHTML='';
 cols.forEach(col=>{const c=document.createElement('div');c.className='kanaCol';col.forEach(ch=>{const b=document.createElement('button');if(!ch){b.className='kanaBtn blank';b.disabled=true}else{b.className='kanaBtn';b.textContent=ch;b.dataset.char=ch;b.onclick=()=>charFn(ch,ch)}c.appendChild(b)});table.appendChild(c)});
 if(noExtra){extra.style.display='none';return}extra.style.display='grid';
 extras.forEach(ch=>{const b=document.createElement('button');b.className='extraBtn';b.textContent=ch;if(ch==='゛')b.onclick=()=>markFn('dakuten');else if(ch==='゜')b.onclick=()=>markFn('handakuten');else b.onclick=()=>charFn(ch,ch);extra.appendChild(b)});
}
function addChar(ch,source){if(!gameActive)return;if(current.length>=5){showMessage('5もじまでだよ');return}if(gameType==='shiritori'&&current.length===0&&requiredStart){const canBecome=ch===requiredStart||dakuten[ch]===requiredStart||handakuten[ch]===requiredStart;if(!canBecome){showMessage('「'+requiredStart+'」から はじめよう');return}}if(useMode==='vanish'&&(permanentlyUsed.has(source)||currentSources.includes(source)))return;current.push(ch);currentSources.push(source);updateWord();refreshKeyboard();clearMessage()}
function applyMark(type){if(!gameActive)return;if(!current.length){showMessage('さきに もじを えらんでね');return}const i=current.length-1,map=type==='dakuten'?dakuten:handakuten;if(!map[current[i]]){showMessage('その もじには つけられないよ');return}current[i]=map[current[i]];updateWord();clearMessage()}
function undoChar(){if(!gameActive||!current.length)return;current.pop();currentSources.pop();updateWord();refreshKeyboard();clearMessage()}
function clearWord(){if(!gameActive)return;current=[];currentSources=[];updateWord();refreshKeyboard();clearMessage()}
function updateWord(){document.getElementById('currentWord').textContent=current.join('')}
function updatePrompt(){const p=document.getElementById('prompt');if(gameType==='word'){if(levelMode==='beginner')p.textContent='あ・か・さ行で ことばを つくろう！';else p.textContent=useMode==='vanish'?'つかった もじは きえていくよ':'ことばを つくろう！'}else p.textContent=requiredStart?'「'+requiredStart+'」から はじまる ことば':'さいしょの ことばを つくろう！'}
function submitWord(){if(!gameActive)return;const word=current.join('');if(word.length<2){showMessage('2もじいじょうの ことばを つくろう');return}if(completedWords.includes(word)){showMessage('その ことばは もう つかったよ');return}if(gameType==='shiritori'&&requiredStart&&word[0]!==requiredStart){showMessage('「'+requiredStart+'」から はじめよう');return}if(!isValidLocalWord_(word)){showMessage('じしょにある ことばを つくろう');return}acceptWord(word)}
function pointsFor(word){return word.length===2?20:word.length===3?30:word.length===4?50:100}
function acceptWord(word){let points=pointsFor(word);if(useMode==='vanish')points*=2;score+=points;if(useMode==='vanish')currentSources.forEach(x=>permanentlyUsed.add(x));completedWords.push(word);renderCompletedWords();if(gameType==='shiritori'){const last=word[word.length-1],n=scriptType==='hira'?'ん':'ン';if(last===n){score=Math.max(0,score-10);requiredStart='';showMessage('「'+n+'」で おわった！ −10てん')}else{requiredStart=normalizeShiritoriStart(last);clearMessage()}}else clearMessage();document.getElementById('score').textContent=score+'てん';showSuccessFlash('💮 ＋'+points+'てん！');current=[];currentSources=[];updateWord();updatePrompt();refreshKeyboard()}
function renderCompletedWords(){const box=document.getElementById('completedWords');box.innerHTML='';completedWords.forEach(word=>{const chip=document.createElement('div');chip.className='wordChip';chip.textContent=word;box.appendChild(chip)});box.scrollTop=box.scrollHeight}
function refreshKeyboard(){document.querySelectorAll('#kanaTable .kanaBtn[data-char]').forEach(b=>{const ch=b.dataset.char;b.disabled=!gameActive||(useMode==='vanish'&&(permanentlyUsed.has(ch)||currentSources.includes(ch)))})}
function normalizeShiritoriStart(ch){const map={'ゃ':'や','ゅ':'ゆ','ょ':'よ','ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ャ':'ヤ','ュ':'ユ','ョ':'ヨ','ァ':'ア','ィ':'イ','ゥ':'ウ','ェ':'エ','ォ':'オ','ッ':'ツ','ー':''};return map[ch]!==undefined?map[ch]:ch}

function startBattle(){
 stopCountdown();battleActive=true;battleTurn=1;battleCurrent=[];battleCurrentSources=[];battleScores=[0,0];battleWords=[[],[]];battleRequiredStart='';battleUsedSources.clear();hideTimers();
 document.getElementById('player1Name').textContent=battleOpponent==='cpu'?'あなた':'プレイヤー1';document.getElementById('player2Name').textContent=battleOpponent==='cpu'?'コンピューター':'プレイヤー2';showScreen('battleScreen');

function buildBattleKeyboard(){const cols=battleScript==='hira'?hiraCols:kataCols,extras=battleScript==='hira'?hiraExtra:kataExtra;buildKanaKeyboard(cols,extras,'battleKanaTable','battleExtraPanel',battleAddChar,battleApplyMark,false);refreshBattleKeyboard()}
function battleAddChar(ch,source){if(!battleActive||!canOnlineAct())return;if(battleOpponent==='cpu'&&battleTurn===2)return;if(battleCurrent.length>=5){battleMessage('5もじまでだよ');return}if(battleGameType==='shiritori'&&battleCurrent.length===0&&battleRequiredStart){const canBecome=ch===battleRequiredStart||dakuten[ch]===battleRequiredStart||handakuten[ch]===battleRequiredStart;if(!canBecome){battleMessage('「'+battleRequiredStart+'」から はじめよう');return}}if(battleUseMode==='vanish'&&(battleUsedSources.has(source)||battleCurrentSources.includes(source)))return;battleCurrent.push(ch);battleCurrentSources.push(source);updateBattleCurrent();refreshBattleKeyboard();battleMessage('')}
function battleApplyMark(type){if(!battleActive||!canOnlineAct())return;if(!battleCurrent.length){battleMessage('さきに もじを えらんでね');return}const i=battleCurrent.length-1,map=type==='dakuten'?dakuten:handakuten;if(!map[battleCurrent[i]]){battleMessage('その もじには つけられないよ');return}battleCurrent[i]=map[battleCurrent[i]];updateBattleCurrent()}
function battleUndo(){if(!battleActive||!canOnlineAct()||!battleCurrent.length)return;battleCurrent.pop();battleCurrentSources.pop();updateBattleCurrent();refreshBattleKeyboard();battleMessage('')}
function battleClear(){if(!battleActive||!canOnlineAct())return;battleCurrent=[];battleCurrentSources=[];updateBattleCurrent();refreshBattleKeyboard();battleMessage('')}
function updateBattleCurrent(){document.getElementById('battleCurrent').textContent=battleCurrent.join('')}
function battleMessage(text){document.getElementById('battleMessage').textContent=text}
function battleSubmit(){if(onlineRoom){onlineSubmit();return}if(!battleActive)return;if(battleOpponent==='cpu'&&battleTurn===2)return;const word=battleCurrent.join('');if(word.length<2){battleMessage('2もじいじょうの ことばを つくろう');return}const allUsed=[...battleWords[0],...battleWords[1]];if(allUsed.includes(word)){battleMessage('その ことばは もう つかったよ');return}if(battleGameType==='shiritori'&&battleRequiredStart&&word[0]!==battleRequiredStart){battleMessage('「'+battleRequiredStart+'」から はじめよう');return}if(!isValidLocalWord_(word)){battleMessage('じしょにある ことばを つくろう');return}const index=battleTurn-1;let point=pointsFor(word);if(battleUseMode==='vanish')point*=2;battleWords[index].push(word);battleScores[index]+=point;if(battleUseMode==='vanish')battleCurrentSources.forEach(x=>battleUsedSources.add(x));updateBattleShiritori(word);showSuccessFlash('💮 ＋'+point+'てん！');battleCurrent=[];battleCurrentSources=[];if(battleOpponent==='human'){battleTurn=battleTurn===1?2:1;updateBattleDisplay()}else{battleTurn=2;updateBattleDisplay();setBattleKeyboardEnabled(false);setTimeout(()=>{if(battleActive)cpuTurn()},700)}}
function updateBattleShiritori(word){if(battleGameType!=='shiritori')return;const last=word[word.length-1],n=battleScript==='hira'?'ん':'ン';if(last===n){const index=battleTurn-1;battleScores[index]=Math.max(0,battleScores[index]-10);battleRequiredStart='';battleMessage('「'+n+'」で おわった！ −10てん')}else battleRequiredStart=normalizeShiritoriStart(last)}
function cpuTurn(){
 if(!battleActive)return;const usedWords=new Set([...battleWords[0],...battleWords[1]].map(normalizeDictionaryWord_)),candidates=[];
 for(const hira of cpuWordList){const word=battleScript==='kata'?hiraToKata_(hira):hira;if(usedWords.has(normalizeDictionaryWord_(word)))continue;if(battleGameType==='shiritori'&&battleRequiredStart&&word[0]!==battleRequiredStart)continue;if(battleUseMode==='vanish'&&!canCpuUseWord(word))continue;candidates.push(word)}
 if(!candidates.length){battleMessage('コンピューターは ことばが みつからなかったよ');battleTurn=1;setBattleKeyboardEnabled(true);updateBattleDisplay();return}
 const word=candidates[Math.floor(Math.random()*candidates.length)];let point=pointsFor(word);if(battleUseMode==='vanish')point*=2;battleWords[1].push(word);battleScores[1]+=point;if(battleUseMode==='vanish')getWordSources(word).forEach(x=>battleUsedSources.add(x));document.getElementById('battleCurrent').textContent=word;if(battleGameType==='shiritori')updateBattleShiritori(word);battleMessage('コンピューターの ことば！');
 setTimeout(()=>{if(!battleActive)return;battleCurrent=[];battleCurrentSources=[];battleTurn=1;updateBattleDisplay();setBattleKeyboardEnabled(true);refreshBattleKeyboard();battleMessage('')},1100);
}
function getSourceChar(ch){return SOURCE_MAP[ch]||ch}
function getWordSources(word){return [...word].map(getSourceChar)}
function canCpuUseWord(word){const sources=getWordSources(word),temp=new Set();for(const source of sources){if(battleUsedSources.has(source)||temp.has(source))return false;temp.add(source)}return true}
function refreshBattleKeyboard(){document.querySelectorAll('#battleKanaTable .kanaBtn[data-char]').forEach(b=>{const ch=b.dataset.char;b.disabled=!battleActive||(battleUseMode==='vanish'&&(battleUsedSources.has(ch)||battleCurrentSources.includes(ch)))})}
function hiraToKata_(text){return [...text].map(ch=>{const c=ch.charCodeAt(0);return c>=0x3041&&c<=0x3096?String.fromCharCode(c+0x60):ch}).join('')}
function setBattleKeyboardEnabled(enabled){document.querySelectorAll('#battleKanaTable button,#battleExtraPanel button,.battleControls button').forEach(b=>b.disabled=!enabled);if(enabled)refreshBattleKeyboard()}
function updateBattleDisplay(){
 document.getElementById('player1Score').textContent=battleScores[0]+'てん';document.getElementById('player2Score').textContent=battleScores[1]+'てん';renderBattleWords(0,'player1Words');renderBattleWords(1,'player2Words');document.getElementById('player1Panel').classList.toggle('activeTurn',battleTurn===1);document.getElementById('player2Panel').classList.toggle('activeTurn',battleTurn===2);
 document.getElementById('battleTurnLabel').textContent=battleOpponent==='cpu'?(battleTurn===1?'あなたの ばん':'コンピューターの ばん'):(battleTurn===1?'プレイヤー1の ばん':'プレイヤー2の ばん');
 let rule=(battleScript==='hira'?'ひらがな':'カタカナ')+' ／ '+(battleGameType==='shiritori'?'しりとり':'ことば')+' ／ '+(battleUseMode==='vanish'?'もじが きえる':'もじが のこる');if(battleTimeMode==='minute')rule+=' ／ ⏱1分';if(battleGameType==='shiritori'&&battleRequiredStart)rule+='　「'+battleRequiredStart+'」から';document.getElementById('battleRuleLabel').textContent=rule;updateBattleCurrent();refreshBattleKeyboard();
}
function renderBattleWords(index,id){const box=document.getElementById(id);box.innerHTML='';battleWords[index].forEach(word=>{const chip=document.createElement('div');chip.className='wordChip';chip.textContent=word;box.appendChild(chip)});box.scrollTop=box.scrollHeight}
function finishBattle(){if(onlineRoom){onlineFinish();return}if(!battleActive)return;stopCountdown();battleActive=false;setBattleKeyboardEnabled(false);const a=battleScores[0],b=battleScores[1];let text;if(a>b)text=battleOpponent==='cpu'?'あなたの かち！':'プレイヤー1の かち！';else if(b>a)text=battleOpponent==='cpu'?'コンピューターの かち！':'プレイヤー2の かち！';else text='ひきわけ！';document.getElementById('finishScore').textContent=a+' － '+b;document.getElementById('finishMessage').textContent=text;document.getElementById('finishOverlay').classList.add('show')}

function openHelp(){stopCountdown();gameActive=false;battleActive=false;showScreen('helpScreen');showHelp('student')}
function showHelp(type){document.getElementById('studentHelpBtn').classList.toggle('selected',type==='student');document.getElementById('teacherHelpBtn').classList.toggle('selected',type==='teacher');const box=document.getElementById('helpContent');box.innerHTML='';if(type==='student'){const img=document.createElement('img');img.src='./使い方.png';img.alt='ことばチャレンジャーの遊び方。50音・しりとり・カタカナ・対戦の説明';img.className='helpPoster';box.appendChild(img)}else{HELP_DATA.teacher.forEach(item=>{const section=document.createElement('div');section.className='helpSection';const h=document.createElement('h2');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.text;section.append(h,p);box.appendChild(section)});const section=document.createElement('div');section.className='helpSection';section.innerHTML='<h2>🌐 オンライン対戦</h2><p>「オンライン」→「へやをつくる」で6桁のコードを発行します。相手はコードを入力するか共有URLを開いて参加します。1人1台で、離れた教室や自宅からも交互に対戦できます。Firebaseの設定が必要です。個人情報は入力しません。</p>';box.appendChild(section)}box.scrollTop=0}

function showSuccessFlash(text){const o=document.getElementById('successFlash');document.getElementById('successFlashInner').textContent=text;o.classList.add('show');clearTimeout(showSuccessFlash.timer);showSuccessFlash.timer=setTimeout(()=>o.classList.remove('show'),1000)}
function showMessage(msg){document.getElementById('message').textContent=msg}
function clearMessage(){document.getElementById('message').textContent=''}
function closeFinish(){document.getElementById('finishOverlay').classList.remove('show');if(onlineRoom){leaveOnlineRoom();openOnline();return}if(document.getElementById('battleScreen').classList.contains('active'))startBattle();else startGame()}
function goTopFromFinish(){document.getElementById('finishOverlay').classList.remove('show');goTop()}

function showKatakanaMenu(){document.getElementById('topScreen').innerHTML='<button class="sn-btn helpBtn" onclick="openHelp()">？ つかいかた</button><h1 class="sn-title katakanaMenuTitle">カタカナチャレンジャー</h1><div class="topBtns" style="grid-template-columns:repeat(2,minmax(300px,360px))"><button class="sn-btn bigBtn hira" onclick="chooseGame(\'word\',\'kata\')"><div class="bigBtnMain">😊 ことば</div><div class="bigBtnSub">チャレンジ</div></button><button class="sn-btn bigBtn shiri" onclick="chooseGame(\'shiritori\',\'kata\')"><div class="bigBtnMain">😊 しりとり</div><div class="bigBtnSub">チャレンジ</div></button></div><button class="sn-home-btn" onclick="restoreTop()">← もどる</button>'}
function restoreTop(){document.getElementById('topScreen').innerHTML='<button class="sn-btn helpBtn" onclick="openHelp()">？ つかいかた</button><h1 class="sn-title">ことばチャレンジャー</h1><div class="topBtns"><button class="sn-btn bigBtn hira" onclick="chooseGame(\'word\',\'hira\')"><div class="bigBtnMain">😊 50音</div><div class="bigBtnSub">チャレンジャー</div></button><button class="sn-btn bigBtn shiri" onclick="chooseGame(\'shiritori\',\'hira\')"><div class="bigBtnMain">😊 しりとり</div><div class="bigBtnSub">チャレンジャー</div></button><button class="sn-btn bigBtn kata" onclick="showKatakanaMenu()"><div class="bigBtnMain">😊 カタカナ</div><div class="bigBtnSub">チャレンジャー</div></button><button class="sn-btn bigBtn battle" onclick="openBattleSetup()"><div class="bigBtnMain">😀 対戦 😊</div><div class="bigBtnSub">チャレンジャー</div></button></div>'}

// Firebaseを利用した招待制オンライン対戦。対戦ルームは24時間で期限切れ。
function onlineStatus(t){document.getElementById('onlineStatus').textContent=t}
function canOnlineAct(){return !onlineRoom||(onlineSnapshot&&onlineSnapshot.status==='playing'&&onlineSnapshot.players[battleTurn-1]===onlineUid&&!onlineBusy)}
async function initOnline(){if(onlineDb)return;const c=window.FIREBASE_CONFIG;if(!c||!c.apiKey||c.apiKey==='YOUR_API_KEY')throw Error('firebase-config.js の設定が必要です');if(!firebase.apps.length)firebase.initializeApp(c);await firebase.auth().signInAnonymously();onlineUid=firebase.auth().currentUser.uid;onlineDb=firebase.firestore()}
function openOnline(){showScreen('onlineScreen');onlineStatus('へやをつくるか、コードを入力してね');const code=new URLSearchParams(location.search).get('room');if(code&&/^\d{6}$/.test(code)){document.getElementById('onlineInput').value=code;joinOnlineRoom()}}
function roomRef(code){return onlineDb.collection('kotobaRooms').doc(code)}
async function createOnlineRoom(){try{await initOnline();leaveOnlineRoom();let code='';for(let n=0;n<8;n++){const a=new Uint32Array(1);crypto.getRandomValues(a);code=String(100000+a[0]%900000);const ref=roomRef(code);const game=document.getElementById('onlineGame').value;const useMode=game==='shiritori'?'remain':document.getElementById('onlineUseMode').value;try{await ref.set({players:[onlineUid],status:'waiting',turn:0,revision:0,words:[[],[]],scores:[0,0],usedSources:[],requiredStart:'',script:document.getElementById('onlineScript').value,game,useMode,timeMode:'free',createdAt:firebase.firestore.FieldValue.serverTimestamp(),expiresAt:Date.now()+86400000});break}catch(e){throw e}}onlineRoom=code;document.getElementById('onlineCode').textContent=code;document.getElementById('onlineInput').value=code;onlineStatus('相手を待っています… URLを共有できます');watchOnlineRoom()}catch(e){onlineStatus('へやを作れません: '+e.message)}}
async function joinOnlineRoom(){const code=document.getElementById('onlineInput').value.trim();if(!/^\d{6}$/.test(code)){onlineStatus('6けたのコードを入力してね');return}try{await initOnline();if(onlineRoom&&onlineRoom!==code)leaveOnlineRoom();const ref=roomRef(code);await onlineDb.runTransaction(async tx=>{const doc=await tx.get(ref);if(!doc.exists)throw Error('へやが見つかりません');const d=doc.data();if(d.expiresAt<Date.now())throw Error('期限切れです');if(d.players.includes(onlineUid))return;if(d.status!=='waiting'||d.players.length!==1)throw Error('すでに2人参加しています');tx.update(ref,{players:[d.players[0],onlineUid],status:'playing',revision:d.revision+1,startedAt:Date.now()})});onlineRoom=code;document.getElementById('onlineCode').textContent=code;watchOnlineRoom()}catch(e){onlineStatus('参加できません: '+e.message)}}
function watchOnlineRoom(){if(onlineUnsub)onlineUnsub();const code=onlineRoom;onlineUnsub=roomRef(code).onSnapshot(doc=>{if(code!==onlineRoom)return;if(!doc.exists){onlineStatus('へやが終了しました');return}const d=doc.data();onlineSnapshot=d;if(d.status==='waiting'){onlineStatus('相手を待っています…');return}if(d.status==='playing'){if(!document.getElementById('battleScreen').classList.contains('active')){battleOpponent='online';battleScript=d.script;battleGameType=d.game;battleUseMode=d.useMode;battleTimeMode=d.timeMode;battleActive=true;showScreen('battleScreen');buildBattleKeyboard()}battleTurn=d.turn+1;battleScores=d.scores;battleWords=d.words;battleRequiredStart=d.requiredStart;battleUsedSources=new Set(d.usedSources);battleCurrent=[];battleCurrentSources=[];updateBattleDisplay();const mine=d.players[d.turn]===onlineUid;setBattleKeyboardEnabled(mine&&!onlineBusy);document.getElementById('onlineBattleState').textContent=mine?'あなたのばん':'相手のばん';document.getElementById('battleTurnLabel').textContent=mine?'あなたの ばん':'あいての ばん';return}if(d.status==='finished'){battleActive=false;setBattleKeyboardEnabled(false);const a=d.scores[0],b=d.scores[1];document.getElementById('finishScore').textContent=a+' － '+b;document.getElementById('finishMessage').textContent=a===b?'ひきわけ！':(d.players[a>b?0:1]===onlineUid?'あなたの かち！':'あいての かち！');document.getElementById('finishOverlay').classList.add('show')}} ,e=>onlineStatus('通信エラー: '+e.message))}
async function onlineSubmit(){if(!canOnlineAct()||!dictionaryReady)return;const word=battleCurrent.join('');if(word.length<2||word.length>5){battleMessage('2～5もじでつくってね');return}if(!isValidLocalWord_(word)){battleMessage('じしょにあることばをつくろう');return}onlineBusy=true;try{await onlineDb.runTransaction(async tx=>{const ref=roomRef(onlineRoom),snap=await tx.get(ref);if(!snap.exists)throw Error('へやがありません');const d=snap.data();if(d.status!=='playing'||d.players[d.turn]!==onlineUid)throw Error('順番が変わりました');if(d.words.flat().includes(word))throw Error('そのことばは使用済みです');if(d.game==='shiritori'&&d.requiredStart&&word[0]!==d.requiredStart)throw Error('「'+d.requiredStart+'」から始めてね');const sources=getWordSources(word);if(d.useMode==='vanish'&&(sources.some(x=>d.usedSources.includes(x))||new Set(sources).size!==sources.length))throw Error('その文字は使えません');const words=d.words.map(a=>a.slice()),scores=d.scores.slice();words[d.turn].push(word);let point=pointsFor(word)*(d.useMode==='vanish'?2:1);scores[d.turn]+=point;const last=word[word.length-1],end=d.script==='hira'?'ん':'ン';let requiredStart=d.requiredStart;if(d.game==='shiritori'){if(last===end){scores[d.turn]=Math.max(0,scores[d.turn]-10);requiredStart=''}else requiredStart=normalizeShiritoriStart(last)}tx.update(ref,{words,scores,requiredStart,usedSources:d.useMode==='vanish'?[...d.usedSources,...sources]:d.usedSources,turn:1-d.turn,revision:d.revision+1})});showSuccessFlash('💮 せいかい！')}catch(e){battleMessage(e.message)}finally{onlineBusy=false}}
async function onlineFinish(){if(!onlineRoom||!onlineDb)return;try{await roomRef(onlineRoom).update({status:'finished'})}catch(e){battleMessage(e.message)}}
function leaveOnlineRoom(){if(onlineUnsub){onlineUnsub();onlineUnsub=null}onlineRoom='';onlineSnapshot=null;onlineBusy=false;document.getElementById('onlineBattleState').textContent='';history.replaceState(null,'',location.pathname)}
function copyOnlineUrl(){if(!onlineRoom){onlineStatus('先にへやをつくってね');return}const url=location.origin+location.pathname+'?room='+onlineRoom;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(()=>onlineStatus('URLをコピーしました')).catch(()=>onlineStatus(url));else onlineStatus(url)}
const invite=new URLSearchParams(location.search).get('room');if(invite&&/^\d{6}$/.test(invite))setTimeout(openOnline,0);
document.addEventListener('click',function(e){if(!e.target.closest('button')){e.preventDefault();e.stopPropagation()}},true);
loadDictionary();
</script>
